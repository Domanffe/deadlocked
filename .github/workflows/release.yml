name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libwayland-dev libxkbcommon-dev libdbus-1-dev libegl1-mesa-dev libgles2-mesa-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Build Release
        run: cargo build --release

      - name: Package Binary
        run: |
          mkdir -p release
          cp target/release/deadlocked release/
          cp license release/
          mkdir -p release/lib
          cp lib/libmapdata.so release/lib/
          cd release
          tar -czf ../deadlocked-x-linux.tar.gz deadlocked license lib
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: deadlocked-x-linux.tar.gz
          body: |
            Source (tag tree): https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}
            Source archive: https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
