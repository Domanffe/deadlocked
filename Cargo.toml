[package]
name = "deadlocked"
version = "4.6.3"
edition = "2024"


[dependencies]
log = "0.4.29"
parking_lot = "0.12.5"
arboard = { version = "3.6.1", default-features = false }
bytemuck = "1.25.0"
crossbeam = "0.8.4"
egui = "0.33.3"
egui_glow = { version = "0.33.3", features = ["winit"] }
egui-winit = { version = "0.33.3", default-features = false, features = ["x11", "wayland"] }
epaint = { version = "0.33.3", features = ["serde"] }
glam = { version = "0.32.1", features = ["bytemuck", "serde"] }
glutin = { version = "0.32.3", default-features = false, features = [
    "x11",
    "wayland",
    "egl",
] }
glutin-winit = { version = "0.5", default-features = false, features = [
    "x11",
    "wayland",
    "egl",
] }
nix = { version = "0.31.2", features = ["ioctl"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10"
rand_distr = "0.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28", features = ["derive"] }
toml = "1.0.6"
tungstenite = "0.28"
ureq = { version = "3.2.0", features = ["json"] }
url = "2.5.8"
uuid = { version = "1.22.0", features = ["v4", "serde"] }
winit = { version = "0.30.13", default-features = false, features = ["x11", "wayland"] }

[build-dependencies]
copy_to_output = "2.2"

[profile.dev]
overflow-checks = false

[profile.release]
lto = true
debug = true

[features]
read-only = []
